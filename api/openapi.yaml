openapi: 3.0.3
info:
  title: Loadout API
  version: 0.1.0
  description: |
    The public REST API of the Loadout store. The web app is its only client.

    Money is always euro cents with VAT included. Errors share one envelope (`Error`): the HTTP
    status is the broad category, `code` is a stable string the web app translates, and `message`
    is for developers only.
servers:
  - url: /api

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Health summary
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database is unreachable. The body still describes the instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /products:
    get:
      operationId: listProducts
      summary: List the products shoppers can see
      tags: [catalog]
      parameters:
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/Category" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /search:
    get:
      operationId: searchProducts
      summary: Search and filter the products shoppers can see, with facet counts
      description: |
        Every filter is optional: without `q` this is a faceted category or catalog listing.
        Each facet ignores its own filter, so after picking one brand the brand facet still
        counts the others the shopper could add.
      tags: [catalog]
      parameters:
        - name: q
          in: query
          description: What the shopper typed. Matches words in the name, brand and SKU, and tolerates typos in the name.
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/Category" }
        - name: brand
          in: query
          description: Any of these brands, as the `brands` facet spells them. Repeat for several.
          schema:
            type: array
            maxItems: 20
            items: { type: string }
          style: form
          explode: true
        - name: price_min
          in: query
          description: Lowest price in euro cents, inclusive.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: price_max
          in: query
          description: Price limit in euro cents, exclusive, so it pairs with a bucket's `max_cents`.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: sort
          in: query
          schema: { $ref: "#/components/schemas/SearchSort" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of matching products and the facets over all matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /products/{slug}:
    get:
      operationId: getProduct
      summary: Product page data
      tags: [catalog]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /builder/check:
    get:
      operationId: checkBuild
      summary: Check a PC build's compatibility, power draw and price
      description: |
        The build is the parts picked so far, by product slug. Rules whose parts aren't picked
        yet don't run, so a partial build has no errors beyond the parts it still needs.
        Parts that aren't for sale any more are listed in `unavailable` and left out of the check.
      tags: [builder]
      parameters:
        - $ref: "#/components/parameters/BuildCPU"
        - $ref: "#/components/parameters/BuildMotherboard"
        - $ref: "#/components/parameters/BuildRAM"
        - $ref: "#/components/parameters/BuildGPU"
        - $ref: "#/components/parameters/BuildStorage"
        - $ref: "#/components/parameters/BuildPSU"
        - $ref: "#/components/parameters/BuildCase"
        - $ref: "#/components/parameters/BuildCooler"
      responses:
        "200":
          description: The checked build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildCheck" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /builder/options:
    get:
      operationId: listBuilderOptions
      summary: The parts that fit a slot of a PC build
      description: |
        Builder-eligible parts for `slot` that fit the rest of the build, cheapest first. A part
        fits if picking it in place of the slot's current parts causes no error involving the
        slot. Parts the build still needs (a cooler for a tray CPU) don't count against it.
      tags: [builder]
      parameters:
        - name: slot
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Slot" }
        - $ref: "#/components/parameters/BuildCPU"
        - $ref: "#/components/parameters/BuildMotherboard"
        - $ref: "#/components/parameters/BuildRAM"
        - $ref: "#/components/parameters/BuildGPU"
        - $ref: "#/components/parameters/BuildStorage"
        - $ref: "#/components/parameters/BuildPSU"
        - $ref: "#/components/parameters/BuildCase"
        - $ref: "#/components/parameters/BuildCooler"
      responses:
        "200":
          description: The parts that fit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuilderOptions" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /builds:
    post:
      operationId: saveBuild
      summary: Save a PC build to share
      description: |
        Stores the build at today's prices under a new short slug, shareable at `/build/{slug}`.
        A build with compatibility errors can be saved; checkout checks it again. An empty build
        (`build: empty`) or one with a part that isn't for sale (`<slot>: unavailable`) is a 422.
      tags: [builder]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildSelection" }
      responses:
        "201":
          description: The saved build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedBuild" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /builds/{slug}:
    get:
      operationId: getBuild
      summary: A saved PC build, checked again at today's parts and prices
      tags: [builder]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The saved build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedBuild" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      description: |
        Starts a session and sets it as an HttpOnly cookie. A wrong password and an unknown email
        get the same 401. Too many failures for the email or the client's IP get a 429, even with
        the right password, until `Retry-After` seconds have passed.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: |
            Logged in. `Set-Cookie` holds the session. An admin still needs the second factor
            (`second_factor` is `enroll` or `verify`) before the admin API lets them in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401":
          description: "`invalid_credentials`: wrong email or password."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429":
          description: "`too_many_attempts`: locked for now."
          headers:
            Retry-After:
              description: Seconds until the next try is allowed.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Ends the session and clears the cookie. Without a session it does nothing.
      tags: [auth]
      responses:
        "204":
          description: Logged out
        default: { $ref: "#/components/responses/Error" }

  /auth/me:
    get:
      operationId: getMe
      summary: The logged-in user
      tags: [auth]
      responses:
        "200":
          description: The user of the session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

  /auth/totp/enroll:
    post:
      operationId: enrollTotp
      summary: Start setting up TOTP
      description: |
        For an admin whose `second_factor` is `enroll`. Returns a new secret for the
        authenticator app; it's active once `/auth/totp/confirm` gets a code from it. Calling
        this again replaces the unconfirmed secret. An admin who already has TOTP gets 409: only
        `loadout admin reset-totp` replaces it.
      tags: [auth]
      responses:
        "200":
          description: The secret, to show as a QR code (`uri`) or to type in (`secret`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/SecondFactorState" }
        default: { $ref: "#/components/responses/Error" }

  /auth/totp/confirm:
    post:
      operationId: confirmTotp
      summary: Finish setting up TOTP with a first code
      description: |
        Turns TOTP on and verifies the session, which gets a new cookie. The recovery codes in
        the response are shown only this once.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: TOTP is on. `Set-Cookie` holds the new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpConfirmed" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/InvalidCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/SecondFactorState" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        default: { $ref: "#/components/responses/Error" }

  /auth/totp/verify:
    post:
      operationId: verifyTotp
      summary: Pass the second factor with a TOTP or recovery code
      description: |
        For an admin whose `second_factor` is `verify`. `code` is the app's 6 digits or one of
        the recovery codes; each works once. The session gets a new cookie.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Verified. `Set-Cookie` holds the new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/InvalidCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/SecondFactorState" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        default: { $ref: "#/components/responses/Error" }

  /auth/totp/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace the recovery codes
      description: For a verified admin. The old codes stop working; the new ones are shown only this once.
      tags: [auth]
      responses:
        "200":
          description: The new codes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/SecondFactorState" }
        default: { $ref: "#/components/responses/Error" }

  /admin/specs/review-queue:
    get:
      operationId: listSpecsReviewQueue
      summary: Builder parts whose specs are incomplete, waiting longest first
      description: |
        A product leaves the queue once every required field has a value. Saving its specs
        without completing them moves it to the end.
      tags: [admin]
      parameters:
        - name: category
          in: query
          description: A builder category. Others have no canonical specs (422).
          schema: { $ref: "#/components/schemas/Category" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of the queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueue" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/specs/{product_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getProductSpecs
      summary: A builder part's canonical fields with the supplier's, the admin's and the effective values
      description: Any builder part, complete or not, active or not. Peripherals have no specs (404).
      tags: [admin]
      responses:
        "200":
          description: The product's specs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductSpecs" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProductSpecs
      summary: Set or clear admin values
      description: |
        Admin values win over the supplier's and survive syncs. `null` removes the admin's value,
        so the supplier's counts again. Fields left out keep their values. Either every value is
        stored or none: a wrong one is a 422 whose `fields` name the canonical field.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecsUpdate" }
      responses:
        "200":
          description: The product's specs after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductSpecs" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/overview:
    get:
      operationId: getAdminOverview
      summary: The numbers on the admin dashboard
      tags: [admin]
      responses:
        "200":
          description: Counts across the back office
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /admin/sync:
    post:
      operationId: triggerSync
      summary: Sync the catalog with the supplier now
      description: |
        Queues a sync job. While one is already waiting or running, nothing new is queued and
        `already_queued` is true. The run shows up in `/admin/sync-runs` once it starts.
      tags: [admin]
      responses:
        "202":
          description: The sync job that will run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncTriggered" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /admin/sync-runs:
    get:
      operationId: listSyncRuns
      summary: Supplier sync runs, newest first
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncRunList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/jobs/discarded:
    get:
      operationId: listDiscardedJobs
      summary: Background jobs that failed every attempt, newest first
      description: |
        River's dead-letter queue. A discarded job stays here until it's retried or deleted.
      tags: [admin]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50, x-go-type-skip-optional-pointer: false }
      responses:
        "200":
          description: The newest discarded jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscardedJobList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/jobs/discarded/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    delete:
      operationId: deleteDiscardedJob
      summary: Delete a discarded job
      description: For a job that doesn't need to run again. Only discarded jobs; any other is a 404.
      tags: [admin]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/jobs/discarded/{job_id}/retry:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: retryDiscardedJob
      summary: Run a discarded job again
      description: |
        Queues the job to run now, with one more attempt. Only discarded jobs; any other is a 404.
        A unique job (a supplier sync) can't be queued twice: while an equal one is waiting or
        running, this is a 409.
      tags: [admin]
      responses:
        "204": { description: Queued }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already_queued`: an equal job is already waiting or running."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/products:
    get:
      operationId: listAdminProducts
      summary: Every product with its dealer price, margin and markup rule, by name
      description: Active or not and priced or not, unlike the storefront's lists.
      tags: [admin]
      parameters:
        - name: q
          in: query
          description: Part of the name, brand or SKU, ignoring case.
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/Category" }
        - name: status
          in: query
          description: "`active`: on the supplier's list. `inactive`: no longer listed. Absent: both."
          schema: { type: string, enum: [active, inactive] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProductList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/markup-rules:
    get:
      operationId: listMarkupRules
      summary: Every markup rule, from the least to the most specific scope
      description: |
        A product is priced by the most specific rule that matches it: `sku` > `brand_category`
        > `category` > `default`.
      tags: [admin]
      responses:
        "200":
          description: The rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupRuleList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMarkupRule
      summary: Add a markup rule
      description: Prices change at the next sync, not now.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkupRuleInput" }
      responses:
        "201":
          description: The new rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupRule" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`duplicate_rule`: a rule for this target already exists."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/markup-rules/{rule_id}:
    parameters:
      - name: rule_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updateMarkupRule
      summary: Change a markup rule
      description: |
        Replaces the rule's target and pricing, if it's still at `version`. Prices change at the
        next sync, not now. The default rule's scope can't change.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkupRuleUpdate" }
      responses:
        "200":
          description: The rule after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupRule" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `edit_conflict`: someone changed the rule since `version`; reload it and try again.
            `duplicate_rule`: another rule has this target. `default_rule`: the default rule
            must stay default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMarkupRule
      summary: Delete a markup rule
      description: |
        Its products keep their prices until the next sync reprices them with the rule that
        matches then.
      tags: [admin]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`default_rule`: the default rule can't be deleted."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      # A pointer in Go, so page=0 is rejected rather than read as "absent".
      schema: { type: integer, minimum: 1, default: 1, x-go-type-skip-optional-pointer: false }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24, x-go-type-skip-optional-pointer: false }

    BuildCPU:
      name: cpu
      in: query
      description: Product slug.
      schema: { type: string }
    BuildMotherboard:
      name: motherboard
      in: query
      description: Product slug.
      schema: { type: string }
    BuildRAM:
      name: ram
      in: query
      description: Product slugs, one per kit. Repeat a slug to buy that kit twice.
      schema: { type: array, maxItems: 4, items: { type: string } }
      style: form
      explode: true
    BuildGPU:
      name: gpu
      in: query
      description: Product slug.
      schema: { type: string }
    BuildStorage:
      name: storage
      in: query
      description: Product slugs, one per drive. Repeat a slug to buy that drive twice.
      schema: { type: array, maxItems: 8, items: { type: string } }
      style: form
      explode: true
    BuildPSU:
      name: psu
      in: query
      description: Product slug.
      schema: { type: string }
    BuildCase:
      name: case
      in: query
      description: Product slug.
      schema: { type: string }
    BuildCooler:
      name: cooler
      in: query
      description: Product slug.
      schema: { type: string }

    JobID:
      name: job_id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    ValidationFailed:
      description: "`validation_failed`: one or more inputs are invalid; see `fields`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidBody:
      description: "`invalid_body`: the request body isn't valid JSON for this endpoint."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: "`unauthenticated`: no valid session."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        `forbidden`: not allowed for this user, or `second_factor_required`: an admin whose
        session hasn't passed the second factor yet.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCode:
      description: "`unauthenticated`: no valid session, or `invalid_code`: a wrong, expired or used code."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SecondFactorState:
      description: "`second_factor_state`: not possible at this session's `second_factor`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyAttempts:
      description: "`too_many_attempts`: locked for now."
      headers:
        Retry-After:
          description: Seconds until the next try is allowed.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Any other error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status, version, env, database, time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        env: { type: string }
        database: { type: string, enum: [ok, unavailable] }
        time: { type: string, format: date-time }

    Category:
      type: string
      description: A canonical product category.
      enum:
        - cpu
        - motherboard
        - ram
        - gpu
        - psu
        - case
        - cooler
        - storage
        - peripheral.chair
        - peripheral.headset
        - peripheral.keyboard
        - peripheral.monitor
        - peripheral.mouse
        - peripheral.mousepad

    Price:
      type: object
      description: A retail price. The web app formats it; it never does price math.
      required: [amount_cents, currency]
      properties:
        amount_cents:
          type: integer
          format: int64
          description: Euro cents, VAT included.
        currency: { type: string, enum: [EUR] }

    ProductSummary:
      type: object
      required: [slug, name, brand, category, price, in_stock]
      properties:
        slug: { type: string }
        name: { type: string }
        brand: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        image:
          type: string
          description: The first image URL. Absent when the product has none.
        price: { $ref: "#/components/schemas/Price" }
        in_stock: { type: boolean }

    ProductList:
      type: object
      required: [products, page, page_size, total]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/ProductSummary" }
        page: { type: integer }
        page_size: { type: integer }
        total:
          type: integer
          description: Matching products over all pages.

    SearchSort:
      type: string
      description: "`relevance` (the default) is the best text match first, or by name without `q`."
      enum: [relevance, price_asc, price_desc]

    SearchResult:
      type: object
      required: [products, page, page_size, total, facets]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/ProductSummary" }
        page: { type: integer }
        page_size: { type: integer }
        total:
          type: integer
          description: Matching products over all pages.
        facets: { $ref: "#/components/schemas/Facets" }

    Facets:
      type: object
      description: Match counts per filter value, most matches first. Values with no matches are left out.
      required: [categories, brands, prices]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/CategoryCount" }
        brands:
          type: array
          items: { $ref: "#/components/schemas/ValueCount" }
        prices:
          type: array
          description: Fixed price ranges, cheapest first.
          items: { $ref: "#/components/schemas/PriceBucket" }

    CategoryCount:
      type: object
      required: [value, count]
      properties:
        value: { $ref: "#/components/schemas/Category" }
        count: { type: integer }

    ValueCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }

    PriceBucket:
      type: object
      description: A price range; filter on it with `price_min` = `min_cents` and `price_max` = `max_cents`.
      required: [min_cents, count]
      properties:
        min_cents:
          type: integer
          format: int64
          description: Euro cents, inclusive.
        max_cents:
          type: integer
          format: int64
          description: Euro cents, exclusive. Absent for the top range, which has no upper limit.
        count: { type: integer }

    ProductDetail:
      type: object
      required: [slug, sku, name, brand, category, images, attributes, specs, price, in_stock]
      properties:
        slug: { type: string }
        sku:
          type: string
          description: The supplier's product code, shown so shoppers can match it elsewhere.
        name: { type: string }
        brand: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        images:
          type: array
          items: { type: string }
        attributes:
          type: object
          description: The supplier's spec rows, for display only.
          additionalProperties: { type: string }
        specs:
          type: object
          description: Canonical spec values (socket, tdp_w, ...). Empty for peripherals.
          additionalProperties: true
        price: { $ref: "#/components/schemas/Price" }
        in_stock: { type: boolean }

    Slot:
      type: string
      description: A part of a PC build, named after its catalog category.
      enum: [cpu, motherboard, ram, gpu, storage, psu, case, cooler]

    FindingRule:
      type: string
      description: |
        The rule behind a finding. The web app has a message for each, filled from `params`.
        `MISSING_SPEC` replaces an error-level check that couldn't run because a spec value is
        unknown (params: `field`, `check`), so an unknown never reads as compatible.
      enum:
        - CPU_MB_SOCKET
        - CPU_MB_GENERATION
        - RAM_MB_TYPE
        - RAM_SLOTS
        - RAM_CAPACITY
        - RAM_SPEED
        - RAM_DUAL_CHANNEL
        - CASE_MB_FORM
        - CASE_GPU_LENGTH
        - CASE_COOLER_HEIGHT
        - CASE_RADIATOR
        - CASE_PSU_FORM
        - COOLER_SOCKET
        - COOLER_REQUIRED
        - COOLER_TDP
        - GPU_REQUIRED
        - PSU_WATTAGE
        - PSU_CONNECTORS
        - STORAGE_M2_SLOTS
        - PART_REQUIRED
        - MISSING_SPEC

    Finding:
      type: object
      description: One problem or note about a build.
      required: [rule, severity, slots, params]
      properties:
        rule: { $ref: "#/components/schemas/FindingRule" }
        severity:
          type: string
          description: "`error`: the parts don't work together and the build can't be ordered. `warning`: it works, but check this. `info`: a note."
          enum: [error, warning, info]
        slots:
          type: array
          description: The parts involved.
          items: { $ref: "#/components/schemas/Slot" }
        params:
          type: object
          description: "The values the message needs, e.g. `{\"gpu_mm\": 340, \"max_mm\": 320}`."
          additionalProperties: true

    BuildPart:
      type: object
      required: [slot, product, specs]
      properties:
        slot: { $ref: "#/components/schemas/Slot" }
        product: { $ref: "#/components/schemas/ProductSummary" }
        specs:
          type: object
          description: Canonical spec values (socket, tdp_w, ...).
          additionalProperties: true

    UnavailablePart:
      type: object
      required: [slot, slug]
      properties:
        slot: { $ref: "#/components/schemas/Slot" }
        slug: { type: string }

    BuildCheck:
      type: object
      required: [parts, unavailable, errors, warnings, info, estimated_power_w, recommended_psu_w, total]
      properties:
        parts:
          type: array
          description: The picked parts in slot order. A part bought twice is listed twice.
          items: { $ref: "#/components/schemas/BuildPart" }
        unavailable:
          type: array
          description: Picked slugs that aren't for sale (any more).
          items: { $ref: "#/components/schemas/UnavailablePart" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        info:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        estimated_power_w:
          type: integer
          description: "Estimated peak draw: CPU TDP × 1.5 + GPU TDP + 50 W + 10 W per drive. 0 for an empty build."
        recommended_psu_w:
          type: integer
          description: The estimate plus 30%, rounded up to the next 50 W.
        total: { $ref: "#/components/schemas/Price" }

    BuilderOption:
      type: object
      required: [product, specs, findings]
      properties:
        product: { $ref: "#/components/schemas/ProductSummary" }
        specs:
          type: object
          description: Canonical spec values (socket, tdp_w, ...).
          additionalProperties: true
        findings:
          type: array
          description: Warnings and notes about this slot if the part is picked.
          items: { $ref: "#/components/schemas/Finding" }

    BuilderOptions:
      type: object
      required: [slot, options]
      properties:
        slot: { $ref: "#/components/schemas/Slot" }
        options:
          type: array
          items: { $ref: "#/components/schemas/BuilderOption" }

    BuildSelection:
      type: object
      description: The parts picked for a build, by product slug, as in the builder's query parameters.
      properties:
        cpu: { type: string }
        motherboard: { type: string }
        ram:
          type: array
          description: One slug per kit. Repeat a slug to buy that kit twice.
          maxItems: 4
          items: { type: string }
        gpu: { type: string }
        storage:
          type: array
          description: One slug per drive. Repeat a slug to buy that drive twice.
          maxItems: 8
          items: { type: string }
        psu: { type: string }
        case: { type: string }
        cooler: { type: string }

    PriceChange:
      type: object
      description: A part whose price changed since the build was saved.
      required: [slot, slug, saved, current]
      properties:
        slot: { $ref: "#/components/schemas/Slot" }
        slug: { type: string }
        saved: { $ref: "#/components/schemas/Price" }
        current: { $ref: "#/components/schemas/Price" }

    SavedBuild:
      type: object
      required: [slug, created_at, check, saved_total, price_changes]
      properties:
        slug: { type: string, description: "Short and random; the share link is `/build/{slug}`." }
        created_at: { type: string, format: date-time }
        check:
          $ref: "#/components/schemas/BuildCheck"
          description: The build checked at today's parts and prices.
        saved_total: { $ref: "#/components/schemas/Price" }
        price_changes:
          type: array
          description: One entry per product whose price changed since it was saved. Empty right after saving.
          items: { $ref: "#/components/schemas/PriceChange" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    Role:
      type: string
      enum: [customer, admin]

    Me:
      type: object
      description: The logged-in user, and where their session stands with the second factor.
      required: [id, email, role, second_factor]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        second_factor: { $ref: "#/components/schemas/SecondFactor" }

    SecondFactor:
      type: string
      description: |
        `not_required`: a customer, or an admin when the second factor is off (development only).
        `enroll`: an admin who must set up TOTP. `verify`: an admin who must enter a code.
        `verified`: done; the admin API is open.
      enum: [not_required, enroll, verify, verified]

    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }

    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: Base32, for typing into the app by hand.
        uri:
          type: string
          description: The `otpauth://totp/...` URI, for a QR code.

    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }

    TotpConfirmed:
      type: object
      required: [me, recovery_codes]
      properties:
        me: { $ref: "#/components/schemas/Me" }
        recovery_codes:
          type: array
          items: { type: string }

    ReviewItem:
      type: object
      required: [product_id, product_name, category, missing, updated_at]
      properties:
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        missing:
          type: array
          description: Required fields without a value.
          items: { type: string }
        updated_at:
          type: string
          format: date-time
          description: When the specs last changed, so how long it has waited.

    ReviewQueue:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ReviewItem" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: Matching products over all pages. }

    SpecStatus:
      type: string
      description: "`approved` once every required field has a value."
      enum: [incomplete, approved]

    SpecKind:
      type: string
      description: The JSON type of a field's values. `string_list` is an array of strings.
      enum: [integer, string, boolean, string_list]

    SpecValue:
      description: A number, string, boolean or array of strings, as the field's `kind` says.
      nullable: true

    SpecField:
      type: object
      description: |
        One canonical field. `value` is the effective one: the admin's, else the supplier's,
        else derived from other fields. `null` means none.
      required: [name, kind, required, supplier, admin, value]
      properties:
        name: { type: string, description: "Canonical field name: socket, tdp_w, ..." }
        kind: { $ref: "#/components/schemas/SpecKind" }
        required:
          type: boolean
          description: The builder needs it, given the product's other values (an air cooler needs a height).
        supplier: { $ref: "#/components/schemas/SpecValue" }
        admin: { $ref: "#/components/schemas/SpecValue" }
        value: { $ref: "#/components/schemas/SpecValue" }

    ProductSpecs:
      type: object
      required: [product_id, product_name, slug, sku, brand, category, active, attributes, status, missing, fields, updated_at]
      properties:
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        slug: { type: string }
        sku: { type: string }
        brand: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        image: { type: string, description: The first image. Absent if there's none. }
        active: { type: boolean, description: Still offered by the supplier. }
        attributes:
          type: object
          description: The supplier's spec rows as it shows them, to read values from.
          additionalProperties: { type: string }
        status: { $ref: "#/components/schemas/SpecStatus" }
        missing:
          type: array
          items: { type: string }
        fields:
          type: array
          description: Every canonical field of the category, in a fixed order.
          items: { $ref: "#/components/schemas/SpecField" }
        updated_at: { type: string, format: date-time }

    SpecsUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: object
          description: Canonical field → admin value; `null` clears it.
          additionalProperties: { $ref: "#/components/schemas/SpecValue" }

    AdminOverview:
      type: object
      required: [specs_incomplete, discarded_jobs, products, last_sync]
      properties:
        specs_incomplete: { type: integer, description: Builder parts waiting in the specs review queue. }
        discarded_jobs: { type: integer }
        products: { $ref: "#/components/schemas/ProductCounts" }
        last_sync:
          description: The newest sync run; `null` before the first one.
          nullable: true
          x-go-type-skip-optional-pointer: false
          allOf: [{ $ref: "#/components/schemas/SyncRun" }]

    ProductCounts:
      type: object
      required: [active, inactive]
      properties:
        active: { type: integer }
        inactive: { type: integer, description: Products the supplier stopped listing. }

    SyncTriggered:
      type: object
      required: [job_id, already_queued]
      properties:
        job_id: { type: integer, format: int64 }
        already_queued:
          type: boolean
          description: A sync was already waiting or running; `job_id` is that one.

    SyncStatus:
      type: string
      enum: [running, succeeded, failed]

    SyncRun:
      type: object
      required: [id, started_at, finished_at, status, fetched, changed, errors, error_message]
      properties:
        id: { type: integer, format: int64 }
        started_at: { type: string, format: date-time }
        finished_at:
          type: string
          format: date-time
          nullable: true
          x-go-type-skip-optional-pointer: false
          description: "`null` while running."
        status: { $ref: "#/components/schemas/SyncStatus" }
        fetched: { type: integer, description: Products the supplier listed. }
        changed: { type: integer, description: "Products whose data, price or stock was written." }
        errors: { type: integer, description: Products skipped because they couldn't be stored. }
        error_message:
          type: string
          nullable: true
          x-go-type-skip-optional-pointer: false
          description: Why a failed run failed. For developers; shown to admins as is.

    SyncRunList:
      type: object
      required: [items, page, page_size, total, queued]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/SyncRun" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
        queued:
          type: boolean
          description: A sync job is waiting or running, so a new run is about to appear or finish.

    DiscardedJob:
      type: object
      required: [id, kind, queue, args, attempt, max_attempts, errors, created_at, finalized_at]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, description: "The job's type: supplier_sync, send_email, ..." }
        queue: { type: string }
        args: { type: object, additionalProperties: true, description: The job's arguments as stored. }
        attempt: { type: integer }
        max_attempts: { type: integer }
        errors:
          type: array
          description: One per failed attempt, oldest first.
          items: { $ref: "#/components/schemas/JobAttemptError" }
        created_at: { type: string, format: date-time }
        finalized_at: { type: string, format: date-time, nullable: true, x-go-type-skip-optional-pointer: false }

    JobAttemptError:
      type: object
      required: [attempt, at, error]
      properties:
        attempt: { type: integer }
        at: { type: string, format: date-time }
        error: { type: string, description: For developers; shown to admins as is. }

    DiscardedJobList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DiscardedJob" }
        total: { type: integer, description: All discarded jobs, not only the ones listed. }

    AdminProduct:
      type: object
      required: [id, slug, sku, name, brand, category, active, price, rule, stock_qty, specs_status, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        sku: { type: string }
        name: { type: string }
        brand: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        image: { type: string, description: The first image. Absent if there's none. }
        active: { type: boolean, description: Still offered by the supplier. }
        price:
          description: "`null` until a sync prices the product."
          nullable: true
          x-go-type-skip-optional-pointer: false
          allOf: [{ $ref: "#/components/schemas/AdminPrice" }]
        rule:
          description: The rule that made the retail price. `null` if unpriced, or the rule was deleted since.
          nullable: true
          x-go-type-skip-optional-pointer: false
          allOf: [{ $ref: "#/components/schemas/PriceRule" }]
        stock_qty: { type: integer, description: What the supplier has. }
        specs_status:
          type: string
          description: "`none` for categories without canonical specs (peripherals)."
          enum: [incomplete, approved, none]
        updated_at: { type: string, format: date-time, description: When the supplier's data last changed. }

    AdminPrice:
      type: object
      description: Euro cents, VAT included in all of them.
      required: [dealer_cents, retail_cents, margin_cents, margin_bp]
      properties:
        dealer_cents: { type: integer, format: int64, description: What we pay the supplier. }
        retail_cents: { type: integer, format: int64, description: What the customer pays. }
        margin_cents: { type: integer, format: int64, description: Retail minus dealer. }
        margin_bp: { type: integer, description: "The margin as a share of retail; 2000 = 20%." }

    PriceRule:
      type: object
      required: [id, scope]
      properties:
        id: { type: integer, format: int64 }
        scope: { $ref: "#/components/schemas/RuleScope" }

    AdminProductList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminProduct" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: Matching products over all pages. }

    RuleScope:
      type: string
      description: What a rule matches on. A more specific scope wins.
      enum: [default, category, brand_category, sku]

    Rounding:
      type: string
      description: "`99` / `90`: round up to a .99 / .90 ending. `none`: to the cent."
      enum: [none, "99", "90"]

    MarkupRuleInput:
      type: object
      description: |
        Set exactly the target fields the scope matches on: `category` for `category`,
        `category` and `brand` for `brand_category`, `sku` for `sku`, none for `default`.
      required: [scope, markup_bp, min_margin_cents, rounding]
      properties:
        scope: { $ref: "#/components/schemas/RuleScope" }
        category: { $ref: "#/components/schemas/Category" }
        brand: { type: string, maxLength: 100, description: "Matches ignoring case." }
        sku: { type: string, maxLength: 100, description: The supplier's product code. }
        markup_bp: { type: integer, minimum: 0, maximum: 100000, description: "2500 = +25% on the dealer price." }
        min_margin_cents:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000
          description: The retail price is at least the dealer price plus this.
        rounding: { $ref: "#/components/schemas/Rounding" }

    MarkupRuleUpdate:
      allOf:
        - $ref: "#/components/schemas/MarkupRuleInput"
        - type: object
          required: [version]
          properties:
            version: { type: integer, description: The version the edit started from. }

    MarkupRule:
      type: object
      required: [id, scope, markup_bp, min_margin_cents, rounding, version, updated_at]
      properties:
        id: { type: integer, format: int64 }
        scope: { $ref: "#/components/schemas/RuleScope" }
        category: { $ref: "#/components/schemas/Category" }
        brand: { type: string }
        sku: { type: string }
        markup_bp: { type: integer }
        min_margin_cents: { type: integer, format: int64 }
        rounding: { $ref: "#/components/schemas/Rounding" }
        version: { type: integer, description: Goes up on every edit; send it back with the next one. }
        updated_at: { type: string, format: date-time }

    ListedMarkupRule:
      allOf:
        - $ref: "#/components/schemas/MarkupRule"
        - type: object
          required: [products]
          properties:
            products: { type: integer, description: Products whose current price this rule made. }

    MarkupRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ListedMarkupRule" }

    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }

    ErrorDetail:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          description: For developers and logs. Never shown to users.
        fields:
          type: array
          description: Only set for `validation_failed`.
          items: { $ref: "#/components/schemas/FieldError" }

    ErrorCode:
      type: string
      description: Stable reason the web app translates. Renaming one breaks translations.
      enum:
        - invalid_body
        - validation_failed
        - not_found
        - unauthenticated
        - forbidden
        - invalid_credentials
        - too_many_attempts
        - second_factor_required
        - invalid_code
        - second_factor_state
        - already_queued
        - edit_conflict
        - duplicate_rule
        - default_rule
        - internal

    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code:
          type: string
          description: Why the field is invalid, e.g. `required`, `out_of_range`, `unknown`, `invalid_format`.
