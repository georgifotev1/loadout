        created_at: { type: string, format: date-time }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        city: { type: string }
        postcode: { type: string }
        address: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        subtotal: { $ref: "#/components/schemas/Price" }
        delivery: { $ref: "#/components/schemas/Price" }
        total: { $ref: "#/components/schemas/Price" }

    OrderLine:
      type: object
      description: A product as it was sold.
      required: [product_id, slug, name, quantity, unit_price, line_total]
      properties:
        product_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        image:
          type: string
          description: Absent when the product had none.
        quantity: { type: integer }
        unit_price: { $ref: "#/components/schemas/Price" }
        line_total: { $ref: "#/components/schemas/Price" }

    OrderSummary:
      type: object
      required: [id, number, status, created_at, count, total]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/OrderStatus" }
        created_at: { type: string, format: date-time }
        count:
          type: integer
          description: Units over all lines.
        total: { $ref: "#/components/schemas/Price" }

    OrderList:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          items: { $ref: "#/components/schemas/OrderSummary" }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password:
          type: string
          description: 10 to 128 characters.

    TokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email: { type: string }

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password:
          type: string
          description: 10 to 128 characters.

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string }
        new_password:
          type: string
          description: 10 to 128 characters.

    Role:
      type: string
      enum: [customer, admin]

    Me:
      type: object
      description: The logged-in user, and where their session stands with the second factor.
      required: [id, email, email_verified, role, second_factor]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        email_verified:
          type: boolean
          description: Whether the user opened a verification or reset link we emailed them.
        role: { $ref: "#/components/schemas/Role" }
        second_factor: { $ref: "#/components/schemas/SecondFactor" }

    SecondFactor:
      type: string
      description: |
        `not_required`: a customer, or an admin when the second factor is off (development only).
        `enroll`: an admin who must set up TOTP. `verify`: an admin who must enter a code.
        `verified`: done; the admin API is open.
      enum: [not_required, enroll, verify, verified]

    CodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string }

    TotpSetup:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
          description: Base32, for typing into the app by hand.
        uri:
          type: string
          description: The `otpauth://totp/...` URI, for a QR code.

    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes:
          type: array
          items: { type: string }

    TotpConfirmed:
      type: object
      required: [me, recovery_codes]
      properties:
        me: { $ref: "#/components/schemas/Me" }
        recovery_codes:
          type: array
          items: { type: string }

    ReviewItem:
      type: object
      required: [product_id, product_name, category, missing, updated_at]
      properties:
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        missing:
          type: array
          description: Required fields without a value.
          items: { type: string }
        updated_at:
          type: string
          format: date-time
          description: When the specs last changed, so how long it has waited.

    ReviewQueue:
      type: object
      required: [items, page, page_size, total]
