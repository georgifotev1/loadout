          description: Waiting for the supplier for more than a day.
        name: { type: string }
        email: { type: string }
        count: { type: integer, description: Units over all lines. }
        total: { $ref: "#/components/schemas/Price" }

    AdminOrderList:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminOrderSummary" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer, description: Matching orders over all pages. }

    AdminOrderLine:
      type: object
      required: [product_id, slug, name, quantity, unit_price, line_total, provider, sku, dealer_unit, vat_bp]
      properties:
        product_id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        image: { type: string, description: Absent when the product had none. }
        quantity: { type: integer }
        unit_price: { $ref: "#/components/schemas/Price" }
        line_total: { $ref: "#/components/schemas/Price" }
        provider: { type: string, description: The supplier to order it from. }
        sku: { type: string, description: The supplier's SKU. }
        dealer_unit:
          description: What one unit cost us at checkout, VAT included.
          allOf: [{ $ref: "#/components/schemas/Price" }]
        vat_bp: { type: integer }

    OrderTransition:
      type: object
      required: [seq, event, from, to, at, actor, note]
      properties:
        seq: { type: integer }
        event: { type: string, description: "What happened: an order event, e.g. `cod_selected`." }
        from: { $ref: "#/components/schemas/OrderStatus" }
        to: { $ref: "#/components/schemas/OrderStatus" }
        at: { type: string, format: date-time }
        actor: { type: string, description: "The admin's email; empty for the system." }
        note: { type: string }

    AdminOrder:
      type: object
      required:
        - id
        - number
        - status
        - payment
        - created_at
        - status_since
        - stale
        - name
        - email
        - phone
        - city
        - postcode
        - address
        - lines
        - subtotal
        - delivery
        - total
        - dealer_total
        - margin
        - transitions
        - actions
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64 }
        token: { type: string, description: Opens the customer's order page. }
        status: { $ref: "#/components/schemas/OrderStatus" }
        payment: { $ref: "#/components/schemas/PaymentMethod" }
        paid_at:
          type: string
          format: date-time
          x-go-type-skip-optional-pointer: false
          description: Missing while unpaid.
        created_at: { type: string, format: date-time }
        status_since: { type: string, format: date-time }
        stale: { type: boolean, description: Waiting for the supplier for more than a day. }
        user_id:
          type: string
          format: uuid
          x-go-type-skip-optional-pointer: false
          description: The account it was placed from; missing for a guest.
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        city: { type: string }
        postcode: { type: string }
        address: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/AdminOrderLine" }
        subtotal: { $ref: "#/components/schemas/Price" }
        delivery: { $ref: "#/components/schemas/Price" }
        total: { $ref: "#/components/schemas/Price" }
        dealer_total:
          description: What the lines cost us, VAT included.
          allOf: [{ $ref: "#/components/schemas/Price" }]
        margin:
          description: The lines' subtotal minus `dealer_total`, VAT included; delivery left out.
          allOf: [{ $ref: "#/components/schemas/Price" }]
        transitions:
          type: array
          description: The order's history, oldest first.
          items: { $ref: "#/components/schemas/OrderTransition" }
        actions:
          type: array
          description: The events an admin can apply now.
          items: { $ref: "#/components/schemas/AdminOrderEvent" }

    AdminOrderCounts:
      type: object
      required: [supplier_pending, stale, refunding]
      properties:
        supplier_pending: { type: integer, description: Waiting for the supplier's answer. }
        stale: { type: integer, description: "Of them, waiting more than a day." }
        refunding: { type: integer }

    RuleScope:
      type: string
      description: What a rule matches on. A more specific scope wins.
      enum: [default, category, brand_category, sku]

    Rounding:
      type: string
      description: "`99` / `90`: round up to a .99 / .90 ending. `none`: to the cent."
      enum: [none, "99", "90"]

    MarkupRuleInput:
      type: object
      description: |
        Set exactly the target fields the scope matches on: `category` for `category`,
        `category` and `brand` for `brand_category`, `sku` for `sku`, none for `default`.
      required: [scope, markup_bp, min_margin_cents, rounding]
      properties:
        scope: { $ref: "#/components/schemas/RuleScope" }
        category: { $ref: "#/components/schemas/Category" }
        brand: { type: string, maxLength: 100, description: "Matches ignoring case." }
        sku: { type: string, maxLength: 100, description: The supplier's product code. }
        markup_bp: { type: integer, minimum: 0, maximum: 100000, description: "2500 = +25% on the dealer price." }
        min_margin_cents:
          type: integer
          format: int64
          minimum: 0
          maximum: 1000000
          description: The retail price is at least the dealer price plus this.
        rounding: { $ref: "#/components/schemas/Rounding" }

    MarkupRuleUpdate:
      allOf:
        - $ref: "#/components/schemas/MarkupRuleInput"
        - type: object
          required: [version]
          properties:
            version: { type: integer, description: The version the edit started from. }

    MarkupRule:
      type: object
      required: [id, scope, markup_bp, min_margin_cents, rounding, version, updated_at]
      properties:
        id: { type: integer, format: int64 }
        scope: { $ref: "#/components/schemas/RuleScope" }
        category: { $ref: "#/components/schemas/Category" }
        brand: { type: string }
        sku: { type: string }
        markup_bp: { type: integer }
        min_margin_cents: { type: integer, format: int64 }
        rounding: { $ref: "#/components/schemas/Rounding" }
        version: { type: integer, description: Goes up on every edit; send it back with the next one. }
        updated_at: { type: string, format: date-time }

    ListedMarkupRule:
      allOf:
        - $ref: "#/components/schemas/MarkupRule"
        - type: object
          required: [products]
          properties:
            products: { type: integer, description: Products whose current price this rule made. }

    MarkupRuleList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ListedMarkupRule" }

    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: "#/components/schemas/ErrorDetail" }

    ErrorDetail:
      type: object
      required: [code]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message:
          type: string
          description: For developers and logs. Never shown to users.
        fields:
          type: array
          description: Only set for `validation_failed`.
          items: { $ref: "#/components/schemas/FieldError" }

    ErrorCode:
      type: string
      description: Stable reason the web app translates. Renaming one breaks translations.
      enum:
        - invalid_body
        - validation_failed
        - not_found
        - unauthenticated
        - forbidden
        - invalid_credentials
        - too_many_attempts
        - second_factor_required
        - invalid_code
        - second_factor_state
        - already_queued
        - edit_conflict
        - duplicate_rule
        - default_rule
        - not_payable
        - invalid_transition
        - internal

    FieldError:
      type: object
      required: [field, code]
      properties:
        field: { type: string }
        code:
          type: string
          description: Why the field is invalid, e.g. `required`, `out_of_range`, `unknown`, `invalid_format`.
