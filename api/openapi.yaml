openapi: 3.0.3
info:
  title: Loadout API
  version: 0.1.0
  description: |
    The public REST API of the Loadout store. The web app is its only client.

    Money is always euro cents with VAT included. Errors share one envelope (`Error`): the HTTP
    status is the broad category, `code` is a stable string the web app translates, and `message`
    is for developers only.
servers:
  - url: /api

paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Health summary
      tags: [health]
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: The database is unreachable. The body still describes the instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /products:
    get:
      operationId: listProducts
      summary: List the products shoppers can see
      tags: [catalog]
      parameters:
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/Category" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /search:
    get:
      operationId: searchProducts
      summary: Search and filter the products shoppers can see, with facet counts
      description: |
        Every filter is optional: without `q` this is a faceted category or catalog listing.
        Each facet ignores its own filter, so after picking one brand the brand facet still
        counts the others the shopper could add.
      tags: [catalog]
      parameters:
        - name: q
          in: query
          description: What the shopper typed. Matches words in the name, brand and SKU, and tolerates typos in the name.
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/Category" }
        - name: brand
          in: query
          description: Any of these brands, as the `brands` facet spells them. Repeat for several.
          schema:
            type: array
            maxItems: 20
            items: { type: string }
          style: form
          explode: true
        - name: price_min
          in: query
          description: Lowest price in euro cents, inclusive.
          schema: { type: integer, format: int64, minimum: 0 }
        - name: price_max
          in: query
          description: Price limit in euro cents, exclusive, so it pairs with a bucket's `max_cents`.
          schema: { type: integer, format: int64, minimum: 1 }
        - name: spec
          in: query
          description: |
            A spec value as `field:value`, e.g. `socket:AM5`, spelled as the `specs` facet spells
            it. Only with `category`, and only its facet fields. Values of one field match any of
            them; separate fields must all match. Repeat for several.
          schema:
            type: array
            maxItems: 20
            items: { type: string, pattern: "^[a-z0-9_]+:.+$" }
          style: form
          explode: true
        - name: sort
          in: query
          schema: { $ref: "#/components/schemas/SearchSort" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of matching products and the facets over all matches
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResult" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /products/{slug}:
    get:
      operationId: getProduct
      summary: Product page data
      tags: [catalog]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /builder/check:
    get:
      operationId: checkBuild
      summary: Check a PC build's compatibility, power draw and price
      description: |
        The build is the parts picked so far, by product slug. Rules whose parts aren't picked
        yet don't run, so a partial build has no errors beyond the parts it still needs.
        Parts that aren't for sale any more are listed in `unavailable` and left out of the check.
      tags: [builder]
      parameters:
        - $ref: "#/components/parameters/BuildCPU"
        - $ref: "#/components/parameters/BuildMotherboard"
        - $ref: "#/components/parameters/BuildRAM"
        - $ref: "#/components/parameters/BuildGPU"
        - $ref: "#/components/parameters/BuildStorage"
        - $ref: "#/components/parameters/BuildPSU"
        - $ref: "#/components/parameters/BuildCase"
        - $ref: "#/components/parameters/BuildCooler"
      responses:
        "200":
          description: The checked build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildCheck" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /builder/options:
    get:
      operationId: listBuilderOptions
      summary: The parts that fit a slot of a PC build
      description: |
        Builder-eligible parts for `slot` that fit the rest of the build, cheapest first. A part
        fits if picking it in place of the slot's current parts causes no error involving the
        slot. Parts the build still needs (a cooler for a tray CPU) don't count against it.
      tags: [builder]
      parameters:
        - name: slot
          in: query
          required: true
          schema: { $ref: "#/components/schemas/Slot" }
        - $ref: "#/components/parameters/BuildCPU"
        - $ref: "#/components/parameters/BuildMotherboard"
        - $ref: "#/components/parameters/BuildRAM"
        - $ref: "#/components/parameters/BuildGPU"
        - $ref: "#/components/parameters/BuildStorage"
        - $ref: "#/components/parameters/BuildPSU"
        - $ref: "#/components/parameters/BuildCase"
        - $ref: "#/components/parameters/BuildCooler"
      responses:
        "200":
          description: The parts that fit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuilderOptions" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /builds:
    post:
      operationId: saveBuild
      summary: Save a PC build to share
      description: |
        Stores the build at today's prices under a new short slug, shareable at `/build/{slug}`.
        A build with compatibility errors can be saved; checkout checks it again. An empty build
        (`build: empty`) or one with a part that isn't for sale (`<slot>: unavailable`) is a 422.
      tags: [builder]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BuildSelection" }
      responses:
        "201":
          description: The saved build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedBuild" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /builds/{slug}:
    get:
      operationId: getBuild
      summary: A saved PC build, checked again at today's parts and prices
      tags: [builder]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The saved build
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedBuild" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /cart:
    get:
      operationId: getCart
      summary: The shopper's cart at today's prices
      description: |
        A logged-in user's cart, or else the cart of the `cart` cookie. Without either, or with a
        cookie whose cart is gone, it's an empty cart; reading never creates one.
      tags: [cart]
      responses:
        "200":
          description: The cart
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        default: { $ref: "#/components/responses/Error" }

  /cart/lines:
    post:
      operationId: addToCart
      summary: Add products to the cart
      description: |
        Adds each product on top of what the cart already has, all or none. Without a cart it
        starts one: the logged-in user's, or else a guest's, and sets the `cart` cookie (HttpOnly,
        30 days, renewed on every change).
        Field errors name `lines[i].slug` (`unavailable`: not for sale; `out_of_stock`) or
        `lines[i].quantity` (`out_of_range`; `too_many`: over 10 of one product with what's in
        the cart), or `lines` (`too_many`: over 50 products in the cart).
      tags: [cart]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartAdd" }
      responses:
        "200":
          description: The cart after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /cart/lines/{product_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: setCartQuantity
      summary: Change how many of a product the cart holds
      tags: [cart]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartQuantity" }
      responses:
        "200":
          description: The cart after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: removeFromCart
      summary: Take a product out of the cart
      description: Removing a product that isn't in the cart isn't an error.
      tags: [cart]
      responses:
        "200":
          description: The cart after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /checkout:
    get:
      operationId: getCheckout
      summary: The cart as checkout shows it, with delivery and the total
      description: |
        The shopper's cart (as `GET /cart`) plus delivery and the total to send back as
        `expected_total_cents`. `orderable` is false for an empty cart or one with a product no
        longer for sale or out of stock. `payments` lists the payment methods on offer.
      tags: [checkout]
      responses:
        "200":
          description: The checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Checkout" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: placeOrder
      summary: Place an order with the cart
      description: |
        Turns the cart into an order at today's prices and empties it (a guest's `cart` cookie is
        cleared). A logged-in customer's order is theirs; a guest opens it with the returned
        `token`. Field errors: `name`, `city`, `address` (`required`, `too_long`); `email`
        (`required`, `invalid_email`); `phone` (`required`, `invalid_phone`); `postcode`
        (`required`, `invalid_postcode`: four digits); `payment` (`unsupported`: not in
        `GET /checkout`'s `payments`); `cart` (`empty`; `unavailable`: a product is no longer for
        sale or out of stock); `expected_total_cents` (`changed`: prices moved since
        `GET /checkout`).

        A card order waits for its payment: send the customer to `payment_url`. Without one
        (Stripe didn't answer), the order page gets it with `POST /orders/{order_id}/payment`.
      tags: [checkout]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutRequest" }
      responses:
        "201":
          description: The order is placed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderPlaced" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /orders:
    get:
      operationId: listMyOrders
      summary: The logged-in customer's orders, newest first
      description: |
        The orders placed while logged in and, once the account's email is verified, the guest
        orders placed with that email.
      tags: [orders]
      responses:
        "200":
          description: The orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

  /orders/{order_id}:
    get:
      operationId: getOrder
      summary: An order, for its customer
      description: |
        Open with the order's `token` (the link from checkout and the emails), or as the
        logged-in customer it belongs to (see `GET /orders`). Anyone else gets a 404, as for an
        order that doesn't exist.
      tags: [orders]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /orders/{order_id}/payment:
    post:
      operationId: payOrder
      summary: Stripe's payment page for a card order
      description: |
        For a card order waiting for its payment (`awaiting_payment`): the address of Stripe's
        payment page to send the customer to. The same page every time, until the order's
        payment window ends. Opens like `GET /orders/{order_id}`. `not_payable` (409): the order
        is paid (also when Stripe says so before its webhook came; the payment is applied then),
        cancelled, cash on delivery, or its payment window is over.
      tags: [orders]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Stripe's payment page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/NotPayable" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /orders/{order_id}/payment/sync:
    post:
      operationId: syncOrderPayment
      summary: Check a card order's payment with Stripe
      description: |
        The order page calls it when the customer comes back from Stripe's payment page: if
        Stripe says the page was paid, the payment is applied now instead of when Stripe's webhook
        arrives. Returns the order as `GET /orders/{order_id}`, and opens like it. Does nothing
        for an order that isn't a card order waiting for its payment.
      tags: [orders]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          schema: { type: string }
      responses:
        "200":
          description: The order after the check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      operationId: login
      summary: Log in with email and password
      description: |
        Starts a session and sets it as an HttpOnly cookie. The guest cart of the `cart` cookie
        moves into the user's cart, and the cookie is cleared. A wrong password and an unknown email
        get the same 401. Too many failures for the email or the client's IP get a 429, even with
        the right password, until `Retry-After` seconds have passed.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: |
            Logged in. `Set-Cookie` holds the session. An admin still needs the second factor
            (`second_factor` is `enroll` or `verify`) before the admin API lets them in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401":
          description: "`invalid_credentials`: wrong email or password."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429":
          description: "`too_many_attempts`: locked for now."
          headers:
            Retry-After:
              description: Seconds until the next try is allowed.
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: |
        Ends the session and clears its cookie and the `cart` cookie; the cart stays with the
        account. Without a session it does nothing.
      tags: [auth]
      responses:
        "204":
          description: Logged out
        default: { $ref: "#/components/responses/Error" }

  /auth/me:
    get:
      operationId: getMe
      summary: The logged-in user
      tags: [auth]
      responses:
        "200":
          description: The user of the session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

  /auth/register:
    post:
      operationId: register
      summary: Sign up as a customer
      description: |
        Answers 202 whether or not the email already has an account, so sign-up can't be used to
        find out who has one. A new account gets an email with a link to verify the address
        (`/auth/verify-email`); a taken address gets an email saying it has an account. It
        doesn't log in: the new customer logs in with `/auth/login`, and the account works
        before the email is verified.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "202":
          description: Accepted; an email is on its way.
        "400": { $ref: "#/components/responses/InvalidBody" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email with the token from the emailed link
      description: |
        Each link works once, for 48 hours, and only the latest one sent. A wrong, expired or used
        token is a 422 with `token: invalid`. It doesn't log in.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TokenRequest" }
      responses:
        "204":
          description: The email is verified.
        "400": { $ref: "#/components/responses/InvalidBody" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /auth/verify-email/resend:
    post:
      operationId: resendVerification
      summary: Email the logged-in user a new verification link
      description: |
        Does nothing if the email is verified already. At most one email per 5 minutes; a resend
        within that is a no-op too.
      tags: [auth]
      responses:
        "204":
          description: Sent, or nothing to send.
        "401": { $ref: "#/components/responses/Unauthenticated" }
        default: { $ref: "#/components/responses/Error" }

  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Email a link to set a new password
      description: |
        Answers 202 whether or not the email has an account. The link works once, for an hour.
        At most one email per 5 minutes.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      responses:
        "202":
          description: Accepted; an email is on its way if the email has an account.
        "400": { $ref: "#/components/responses/InvalidBody" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /auth/password/reset:
    post:
      operationId: resetPassword
      summary: Set a new password with the token from the emailed link
      description: |
        Logs the user out everywhere and starts a new session (an admin still needs the second
        factor). It also verifies the email. A wrong, expired or used token is a 422 with
        `token: invalid`.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      responses:
        "200":
          description: The password is set. `Set-Cookie` holds the new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /auth/password:
    post:
      operationId: changePassword
      summary: Change the logged-in user's password
      description: |
        Logs the user out of their other sessions and replaces this one. A wrong current password
        is a 422 with `current_password: incorrect`, and counts as a failed login for the email.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Changed. `Set-Cookie` holds the new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        default: { $ref: "#/components/responses/Error" }

  /auth/totp/enroll:
    post:
      operationId: enrollTotp
      summary: Start setting up TOTP
      description: |
        For an admin whose `second_factor` is `enroll`. Returns a new secret for the
        authenticator app; it's active once `/auth/totp/confirm` gets a code from it. Calling
        this again replaces the unconfirmed secret. An admin who already has TOTP gets 409: only
        `loadout admin reset-totp` replaces it.
      tags: [auth]
      responses:
        "200":
          description: The secret, to show as a QR code (`uri`) or to type in (`secret`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpSetup" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/SecondFactorState" }
        default: { $ref: "#/components/responses/Error" }

  /auth/totp/confirm:
    post:
      operationId: confirmTotp
      summary: Finish setting up TOTP with a first code
      description: |
        Turns TOTP on and verifies the session, which gets a new cookie. The recovery codes in
        the response are shown only this once.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: TOTP is on. `Set-Cookie` holds the new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TotpConfirmed" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/InvalidCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/SecondFactorState" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        default: { $ref: "#/components/responses/Error" }

  /auth/totp/verify:
    post:
      operationId: verifyTotp
      summary: Pass the second factor with a TOTP or recovery code
      description: |
        For an admin whose `second_factor` is `verify`. `code` is the app's 6 digits or one of
        the recovery codes; each works once. The session gets a new cookie.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CodeRequest" }
      responses:
        "200":
          description: Verified. `Set-Cookie` holds the new session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/InvalidCode" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/SecondFactorState" }
        "429": { $ref: "#/components/responses/TooManyAttempts" }
        default: { $ref: "#/components/responses/Error" }

  /auth/totp/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Replace the recovery codes
      description: For a verified admin. The old codes stop working; the new ones are shown only this once.
      tags: [auth]
      responses:
        "200":
          description: The new codes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/SecondFactorState" }
        default: { $ref: "#/components/responses/Error" }

  /admin/specs/review-queue:
    get:
      operationId: listSpecsReviewQueue
      summary: Builder parts whose specs are incomplete, waiting longest first
      description: |
        A product leaves the queue once every required field has a value. Saving its specs
        without completing them moves it to the end.
      tags: [admin]
      parameters:
        - name: category
          in: query
          description: A builder category. Others have no canonical specs (422).
          schema: { $ref: "#/components/schemas/Category" }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of the queue
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReviewQueue" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/specs/{product_id}:
    parameters:
      - name: product_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getProductSpecs
      summary: A builder part's canonical fields with the supplier's, the admin's and the effective values
      description: Any builder part, complete or not, active or not. Peripherals have no specs (404).
      tags: [admin]
      responses:
        "200":
          description: The product's specs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductSpecs" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }
    patch:
      operationId: updateProductSpecs
      summary: Set or clear admin values
      description: |
        Admin values win over the supplier's and survive syncs. `null` removes the admin's value,
        so the supplier's counts again. Fields left out keep their values. Either every value is
        stored or none: a wrong one is a 422 whose `fields` name the canonical field.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpecsUpdate" }
      responses:
        "200":
          description: The product's specs after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductSpecs" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/overview:
    get:
      operationId: getAdminOverview
      summary: The numbers on the admin dashboard
      tags: [admin]
      responses:
        "200":
          description: Counts across the back office
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOverview" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /admin/sync:
    post:
      operationId: triggerSync
      summary: Sync the catalog with the supplier now
      description: |
        Queues a sync job. While one is already waiting or running, nothing new is queued and
        `already_queued` is true. The run shows up in `/admin/sync-runs` once it starts.
      tags: [admin]
      responses:
        "202":
          description: The sync job that will run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncTriggered" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /admin/sync-runs:
    get:
      operationId: listSyncRuns
      summary: Supplier sync runs, newest first
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of runs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncRunList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/jobs/discarded:
    get:
      operationId: listDiscardedJobs
      summary: Background jobs that failed every attempt, newest first
      description: |
        River's dead-letter queue. A discarded job stays here until it's retried or deleted.
      tags: [admin]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50, x-go-type-skip-optional-pointer: false }
      responses:
        "200":
          description: The newest discarded jobs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscardedJobList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/jobs/discarded/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    delete:
      operationId: deleteDiscardedJob
      summary: Delete a discarded job
      description: For a job that doesn't need to run again. Only discarded jobs; any other is a 404.
      tags: [admin]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/jobs/discarded/{job_id}/retry:
    parameters:
      - $ref: "#/components/parameters/JobID"
    post:
      operationId: retryDiscardedJob
      summary: Run a discarded job again
      description: |
        Queues the job to run now, with one more attempt. Only discarded jobs; any other is a 404.
        A unique job (a supplier sync) can't be queued twice: while an equal one is waiting or
        running, this is a 409.
      tags: [admin]
      responses:
        "204": { description: Queued }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`already_queued`: an equal job is already waiting or running."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/products:
    get:
      operationId: listAdminProducts
      summary: Every product with its dealer price, margin and markup rule, by name
      description: Active or not and priced or not, unlike the storefront's lists.
      tags: [admin]
      parameters:
        - name: q
          in: query
          description: Part of the name, brand or SKU, ignoring case.
          schema: { type: string, maxLength: 200 }
        - name: category
          in: query
          schema: { $ref: "#/components/schemas/Category" }
        - name: status
          in: query
          description: "`active`: on the supplier's list. `inactive`: no longer listed. Absent: both."
          schema: { type: string, enum: [active, inactive] }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of products
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProductList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/orders:
    get:
      operationId: listAdminOrders
      summary: Orders, the newest first
      description: |
        With `needs_action`, only the orders waiting for an admin (`supplier_pending`,
        `refunding`), the longest waiting first.
      tags: [admin]
      parameters:
        - name: q
          in: query
          description: An order number, or part of the customer's name, email or phone.
          schema: { type: string, maxLength: 200 }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/OrderStatus" }
        - name: needs_action
          in: query
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of orders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrderList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/orders/{order_id}:
    get:
      operationId: getAdminOrder
      summary: An order with its supplier prices, history and the admin's actions
      tags: [admin]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/orders/{order_id}/events:
    post:
      operationId: applyAdminOrderEvent
      summary: Apply an admin's event to an order
      description: |
        One of the order's `actions`. An event the order has already taken (a second click)
        changes nothing. `invalid_transition` (409): the order can't take it in its status,
        e.g. it was cancelled meanwhile. `refund_succeeded` needs a `note`: how the money went
        back.
      tags: [admin]
      parameters:
        - name: order_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminOrderEventInput" }
      responses:
        "200":
          description: The order after it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`invalid_transition`: the order can't take the event in its status."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/markup-rules:
    get:
      operationId: listMarkupRules
      summary: Every markup rule, from the least to the most specific scope
      description: |
        A product is priced by the most specific rule that matches it: `sku` > `brand_category`
        > `category` > `default`.
      tags: [admin]
      responses:
        "200":
          description: The rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupRuleList" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
    post:
      operationId: createMarkupRule
      summary: Add a markup rule
      description: Prices change at the next sync, not now.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkupRuleInput" }
      responses:
        "201":
          description: The new rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupRule" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: "`duplicate_rule`: a rule for this target already exists."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

  /admin/markup-rules/{rule_id}:
    parameters:
      - name: rule_id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    put:
      operationId: updateMarkupRule
      summary: Change a markup rule
      description: |
        Replaces the rule's target and pricing, if it's still at `version`. Prices change at the
        next sync, not now. The default rule's scope can't change.
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkupRuleUpdate" }
      responses:
        "200":
          description: The rule after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkupRule" }
        "400": { $ref: "#/components/responses/InvalidBody" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `edit_conflict`: someone changed the rule since `version`; reload it and try again.
            `duplicate_rule`: another rule has this target. `default_rule`: the default rule
            must stay default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMarkupRule
      summary: Delete a markup rule
      description: |
        Its products keep their prices until the next sync reprices them with the rule that
        matches then.
      tags: [admin]
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`default_rule`: the default rule can't be deleted."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    Page:
      name: page
      in: query
      description: 1-based page number.
      # A pointer in Go, so page=0 is rejected rather than read as "absent".
      schema: { type: integer, minimum: 1, default: 1, x-go-type-skip-optional-pointer: false }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24, x-go-type-skip-optional-pointer: false }

    BuildCPU:
      name: cpu
      in: query
      description: Product slug.
      schema: { type: string }
    BuildMotherboard:
      name: motherboard
      in: query
      description: Product slug.
      schema: { type: string }
    BuildRAM:
      name: ram
      in: query
      description: Product slugs, one per kit. Repeat a slug to buy that kit twice.
      schema: { type: array, maxItems: 4, items: { type: string } }
      style: form
      explode: true
    BuildGPU:
      name: gpu
      in: query
      description: Product slug.
      schema: { type: string }
    BuildStorage:
      name: storage
      in: query
      description: Product slugs, one per drive. Repeat a slug to buy that drive twice.
      schema: { type: array, maxItems: 8, items: { type: string } }
      style: form
      explode: true
    BuildPSU:
      name: psu
      in: query
      description: Product slug.
      schema: { type: string }
    BuildCase:
      name: case
      in: query
      description: Product slug.
      schema: { type: string }
    BuildCooler:
      name: cooler
      in: query
      description: Product slug.
      schema: { type: string }

    JobID:
      name: job_id
      in: path
      required: true
      schema: { type: integer, format: int64 }

  responses:
    ValidationFailed:
      description: "`validation_failed`: one or more inputs are invalid; see `fields`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidBody:
      description: "`invalid_body`: the request body isn't valid JSON for this endpoint."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: "`not_found`"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: "`unauthenticated`: no valid session."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: |
        `forbidden`: not allowed for this user, or `second_factor_required`: an admin whose
        session hasn't passed the second factor yet.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCode:
      description: "`unauthenticated`: no valid session, or `invalid_code`: a wrong, expired or used code."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotPayable:
      description: "`not_payable`: the order can't be paid by card (any more)."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SecondFactorState:
      description: "`second_factor_state`: not possible at this session's `second_factor`."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyAttempts:
      description: "`too_many_attempts`: locked for now."
      headers:
        Retry-After:
          description: Seconds until the next try is allowed.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error:
      description: Any other error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Health:
      type: object
      required: [status, version, env, database, time]
      properties:
        status: { type: string, enum: [ok, degraded] }
        version: { type: string }
        env: { type: string }
        database: { type: string, enum: [ok, unavailable] }
        time: { type: string, format: date-time }

    Category:
      type: string
      description: A canonical product category.
      enum:
        - cpu
        - motherboard
        - ram
        - gpu
        - psu
        - case
        - cooler
        - storage
        - peripheral.chair
        - peripheral.headset
        - peripheral.keyboard
        - peripheral.monitor
        - peripheral.mouse
        - peripheral.mousepad

    Price:
      type: object
      description: A retail price. The web app formats it; it never does price math.
      required: [amount_cents, currency]
      properties:
        amount_cents:
          type: integer
          format: int64
          description: Euro cents, VAT included.
        currency: { type: string, enum: [EUR] }

    ProductSummary:
      type: object
      required: [slug, name, brand, category, price, in_stock]
      properties:
        slug: { type: string }
        name: { type: string }
        brand: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        image:
          type: string
          description: The first image URL. Absent when the product has none.
        price: { $ref: "#/components/schemas/Price" }
        in_stock: { type: boolean }
        specs:
          type: object
          description: |
            Canonical spec values (socket, vram_gb, ...), for the card's key specs. Absent for
            peripherals, and where the response has them elsewhere (builder options).
          additionalProperties: true

    ProductList:
      type: object
      required: [products, page, page_size, total]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/ProductSummary" }
        page: { type: integer }
        page_size: { type: integer }
        total:
          type: integer
          description: Matching products over all pages.

    SearchSort:
      type: string
      description: "`relevance` (the default) is the best text match first, or by name without `q`."
      enum: [relevance, price_asc, price_desc]

    SearchResult:
      type: object
      required: [products, page, page_size, total, facets]
      properties:
        products:
          type: array
          items: { $ref: "#/components/schemas/ProductSummary" }
        page: { type: integer }
        page_size: { type: integer }
        total:
          type: integer
          description: Matching products over all pages.
        facets: { $ref: "#/components/schemas/Facets" }

    Facets:
      type: object
      description: Match counts per filter value, most matches first. Values with no matches are left out.
      required: [categories, brands, prices, specs]
      properties:
        categories:
          type: array
          items: { $ref: "#/components/schemas/CategoryCount" }
        brands:
          type: array
          items: { $ref: "#/components/schemas/ValueCount" }
        prices:
          type: array
          description: Fixed price ranges, cheapest first.
          items: { $ref: "#/components/schemas/PriceBucket" }
        specs:
          type: array
          description: The category's spec fields, in display order. Empty without `category`.
          items: { $ref: "#/components/schemas/SpecFacet" }

    SpecFacet:
      type: object
      required: [field, values]
      properties:
        field:
          type: string
          description: A canonical spec field, e.g. `socket`.
        values:
          type: array
          description: |
            Canonical values as text ("AM5", "16", "nvme"): smallest number first for number
            fields, else alphabetical.
          items: { $ref: "#/components/schemas/ValueCount" }

    CategoryCount:
      type: object
      required: [value, count]
      properties:
        value: { $ref: "#/components/schemas/Category" }
        count: { type: integer }

    ValueCount:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }

    PriceBucket:
      type: object
      description: A price range; filter on it with `price_min` = `min_cents` and `price_max` = `max_cents`.
      required: [min_cents, count]
      properties:
        min_cents:
          type: integer
          format: int64
          description: Euro cents, inclusive.
        max_cents:
          type: integer
          format: int64
          description: Euro cents, exclusive. Absent for the top range, which has no upper limit.
        count: { type: integer }

    ProductDetail:
      type: object
      required: [slug, sku, name, brand, category, images, attributes, specs, price, in_stock]
      properties:
        slug: { type: string }
        sku:
          type: string
          description: The supplier's product code, shown so shoppers can match it elsewhere.
        name: { type: string }
        brand: { type: string }
        category: { $ref: "#/components/schemas/Category" }
        images:
          type: array
          items: { type: string }
        attributes:
          type: object
          description: The supplier's spec rows, for display only.
          additionalProperties: { type: string }
        specs:
          type: object
          description: Canonical spec values (socket, tdp_w, ...). Empty for peripherals.
          additionalProperties: true
        price: { $ref: "#/components/schemas/Price" }
        in_stock: { type: boolean }

    Slot:
      type: string
      description: A part of a PC build, named after its catalog category.
      enum: [cpu, motherboard, ram, gpu, storage, psu, case, cooler]

    FindingRule:
      type: string
      description: |
        The rule behind a finding. The web app has a message for each, filled from `params`.
        `MISSING_SPEC` replaces an error-level check that couldn't run because a spec value is
        unknown (params: `field`, `check`), so an unknown never reads as compatible.
      enum:
        - CPU_MB_SOCKET
        - CPU_MB_GENERATION
        - RAM_MB_TYPE
        - RAM_SLOTS
        - RAM_CAPACITY
        - RAM_SPEED
        - RAM_DUAL_CHANNEL
        - CASE_MB_FORM
        - CASE_GPU_LENGTH
        - CASE_COOLER_HEIGHT
        - CASE_RADIATOR
        - CASE_PSU_FORM
        - COOLER_SOCKET
        - COOLER_REQUIRED
        - COOLER_TDP
        - GPU_REQUIRED
        - PSU_WATTAGE
        - PSU_CONNECTORS
        - STORAGE_M2_SLOTS
        - PART_REQUIRED
        - MISSING_SPEC

    Finding:
      type: object
      description: One problem or note about a build.
      required: [rule, severity, slots, params]
      properties:
        rule: { $ref: "#/components/schemas/FindingRule" }
        severity:
          type: string
          description: "`error`: the parts don't work together and the build can't be ordered. `warning`: it works, but check this. `info`: a note."
          enum: [error, warning, info]
        slots:
          type: array
          description: The parts involved.
          items: { $ref: "#/components/schemas/Slot" }
        params:
          type: object
          description: "The values the message needs, e.g. `{\"gpu_mm\": 340, \"max_mm\": 320}`."
          additionalProperties: true

    BuildPart:
      type: object
      required: [slot, product, specs]
      properties:
        slot: { $ref: "#/components/schemas/Slot" }
        product: { $ref: "#/components/schemas/ProductSummary" }
        specs:
          type: object
          description: Canonical spec values (socket, tdp_w, ...).
          additionalProperties: true

    UnavailablePart:
      type: object
      required: [slot, slug]
      properties:
        slot: { $ref: "#/components/schemas/Slot" }
        slug: { type: string }

    BuildCheck:
      type: object
      required: [parts, unavailable, errors, warnings, info, estimated_power_w, recommended_psu_w, total]
      properties:
        parts:
          type: array
          description: The picked parts in slot order. A part bought twice is listed twice.
          items: { $ref: "#/components/schemas/BuildPart" }
        unavailable:
          type: array
          description: Picked slugs that aren't for sale (any more).
          items: { $ref: "#/components/schemas/UnavailablePart" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        info:
          type: array
          items: { $ref: "#/components/schemas/Finding" }
        estimated_power_w:
          type: integer
          description: "Estimated peak draw: CPU TDP × 1.5 + GPU TDP + 50 W + 10 W per drive. 0 for an empty build."
        recommended_psu_w:
          type: integer
          description: The estimate plus 30%, rounded up to the next 50 W.
        total: { $ref: "#/components/schemas/Price" }

    BuilderOption:
      type: object
      required: [product, specs, findings]
      properties:
        product: { $ref: "#/components/schemas/ProductSummary" }
        specs:
          type: object
          description: Canonical spec values (socket, tdp_w, ...).
          additionalProperties: true
        findings:
          type: array
          description: Warnings and notes about this slot if the part is picked.
          items: { $ref: "#/components/schemas/Finding" }

    BuilderOptions:
      type: object
      required: [slot, options]
      properties:
        slot: { $ref: "#/components/schemas/Slot" }
        options:
          type: array
          items: { $ref: "#/components/schemas/BuilderOption" }

    BuildSelection:
      type: object
      description: The parts picked for a build, by product slug, as in the builder's query parameters.
      properties:
        cpu: { type: string }
        motherboard: { type: string }
        ram:
          type: array
          description: One slug per kit. Repeat a slug to buy that kit twice.
          maxItems: 4
          items: { type: string }
        gpu: { type: string }
        storage:
          type: array
          description: One slug per drive. Repeat a slug to buy that drive twice.
          maxItems: 8
          items: { type: string }
        psu: { type: string }
        case: { type: string }
        cooler: { type: string }

    PriceChange:
      type: object
      description: A part whose price changed since the build was saved.
      required: [slot, slug, saved, current]
      properties:
        slot: { $ref: "#/components/schemas/Slot" }
        slug: { type: string }
        saved: { $ref: "#/components/schemas/Price" }
        current: { $ref: "#/components/schemas/Price" }

    SavedBuild:
      type: object
      required: [slug, created_at, check, saved_total, price_changes]
      properties:
        slug: { type: string, description: "Short and random; the share link is `/build/{slug}`." }
        created_at: { type: string, format: date-time }
        check:
          $ref: "#/components/schemas/BuildCheck"
          description: The build checked at today's parts and prices.
        saved_total: { $ref: "#/components/schemas/Price" }
        price_changes:
          type: array
          description: One entry per product whose price changed since it was saved. Empty right after saving.
          items: { $ref: "#/components/schemas/PriceChange" }

    Cart:
      type: object
      required: [lines, count, subtotal]
      properties:
        lines:
          type: array
          description: The last added first.
          items: { $ref: "#/components/schemas/CartLine" }
        count:
          type: integer
          description: Units over all lines, for the header badge.
        subtotal:
          $ref: "#/components/schemas/Price"
          description: The lines still for sale, at today's prices. Delivery comes at checkout.

    CartLine:
      type: object
      required: [product_id, slug, name, quantity]
      properties:
        product_id: { type: string, format: uuid }
        slug:
          type: string
          description: The product's slug now, or as it was added if it's no longer for sale.
        name: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 10 }
        product:
          description: |
            The product as it's sold now. Absent when it's no longer for sale: the line stays so
            the shopper sees what happened, but it isn't in the subtotal and can't be ordered.
          x-go-type-skip-optional-pointer: false
          allOf: [{ $ref: "#/components/schemas/ProductSummary" }]
        line_total:
          description: The price now × quantity. Absent when the product is no longer for sale.
          x-go-type-skip-optional-pointer: false
          allOf: [{ $ref: "#/components/schemas/Price" }]

    CartAdd:
      type: object
      required: [lines]
      properties:
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [slug, quantity]
            properties:
              slug: { type: string }
              quantity: { type: integer, minimum: 1, maximum: 10 }

    CartQuantity:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, maximum: 10 }

    Checkout:
      type: object
      required: [cart, delivery, total, orderable, payments]
      properties:
        cart: { $ref: "#/components/schemas/Cart" }
        delivery:
          $ref: "#/components/schemas/Price"
          description: Delivery to an address.
        total:
          $ref: "#/components/schemas/Price"
          description: The subtotal and delivery. Send it back as `expected_total_cents`.
        orderable:
          type: boolean
          description: Whether the cart can be ordered as it is.
        payments:
          type: array
          description: The payment methods on offer, cash on delivery first.
          items: { $ref: "#/components/schemas/PaymentMethod" }

    PaymentMethod:
      type: string
      description: |
        `cod`: cash on delivery, paid to the courier; `card`: online on Stripe's payment page
        (cards, Apple Pay, Google Pay, … as set up in Stripe).
      enum: [cod, card]

    CheckoutRequest:
      type: object
      required: [name, email, phone, city, postcode, address, payment, expected_total_cents]
      properties:
        name: { type: string, description: The recipient's full name. }
        email: { type: string }
        phone: { type: string }
        city: { type: string }
        postcode: { type: string, description: Four digits. }
        address: { type: string, description: "Street, number, floor: what the courier needs." }
        payment: { $ref: "#/components/schemas/PaymentMethod" }
        expected_total_cents:
          type: integer
          format: int64
          description: The `total` the customer saw at `GET /checkout`.

    OrderPlaced:
      type: object
      required: [id, number, token]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64 }
        token:
          type: string
          description: Opens the order with `GET /orders/{order_id}?token=`, without logging in.
        payment_url:
          type: string
          description: |
            A card order's payment page on Stripe, to send the customer to. Missing if Stripe
            couldn't be reached: then `POST /orders/{order_id}/payment`.

    Payment:
      type: object
      required: [url]
      properties:
        url: { type: string, description: Stripe's payment page. }

    OrderStatus:
      type: string
      description: |
        `awaiting_payment`; `supplier_pending`: we're confirming the parts with the supplier;
        `ready_to_ship`; `shipped`; `delivered`; `refunding`; `cancelled`.
      enum:
        - awaiting_payment
        - supplier_pending
        - ready_to_ship
        - shipped
        - delivered
        - refunding
        - cancelled

    Order:
      type: object
      required:
        - id
        - number
        - status
        - payment
        - created_at
        - name
        - email
        - phone
        - city
        - postcode
        - address
        - lines
        - subtotal
        - delivery
        - total
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64 }
        status: { $ref: "#/components/schemas/OrderStatus" }
        payment: { $ref: "#/components/schemas/PaymentMethod" }
        paid_at:
          type: string
          format: date-time
          x-go-type-skip-optional-pointer: false
          description: |
            When the money came: the card payment, or the courier collecting cash on delivery.
